[project]
name = "agent-gateway-control"
version = "0.1.0"
description = "agent-gateway 控制层：用户体系、Agent 编排、会话归属、SSE 代理"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.32.0",          # ★ >=0.32.0：旧版在 3.14 无预编译 wheel
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",   # EmailStr 需要 email-validator
    "pyyaml>=6.0.2",            # A2A：读写 profile 的 config.yaml
    "python-multipart>=0.0.12",
    "lark-oapi>=1.4.0",         # 连接器：飞书（批次 3）
    "slack-bolt>=1.21.0",       # 连接器：Slack Socket Mode（批次 3）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",        # 测试用内存库
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
