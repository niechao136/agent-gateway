# agent-gateway — 开发环境编排
#
# 设计要点（详见 SPEC.md §8）：
#   1. 用自定义 bridge 网络，不用 network_mode: host（否则容器名无法互访）
#   2. hermes 的 /opt/data 用 bind mount，但**必须**落在 WSL 的 ext4 上
#      （9p/drvfs 会让 SQLite WAL 静默损坏）
#   3. **hermes 只起一个容器**：gateway 与 dashboard 由 s6 在同一容器内监管。
#      两个容器共享同一个 /opt/data 会争抢 gateway.lock，导致 dashboard
#      反复崩溃重启（实测 RestartCount 持续增长）。
#   4. 控制层与 hermes 走内网，不对外暴露端口
#
# 用法（所有环境统一，差异只在 .env）：
#   cp .env.example .env    # 按环境改 INTERNET_MODE / DATA_DIR / DATA_UID / DATA_GID
#   make bootstrap          # 自动建目录 + 修权限 + build + up
#   make up                 # 后续启动（不重建镜像）
#
# 环境变量分组见 .env.example；镜像源由 Makefile 按 INTERNET_MODE 派生。
# 数据目录（ext4，WAL 安全，统一在 ${DATA_DIR} 下）：
#   ${DATA_DIR}/hermes    → /opt/data
#   ${DATA_DIR}/postgres  → /var/lib/postgresql/data

name: agent-gateway

services:
  # ───────────────────────────────────────────────────────────
  # hermes：单容器，s6 同时监管 gateway 与 dashboard
  #   - gateway   : 8642   OpenAI 兼容 API（公开聊天）
  #   - dashboard : 9119   profile / skills / mcp 管理 API
  # 不 publish 端口，仅供控制层与 nginx 内网访问
  # ───────────────────────────────────────────────────────────
  hermes:
    # 固定版本 tag：不随 :latest 漂移（避免重新下载与版本不兼容）。
    # v0.23.2 = 生产已充分验证版本，multi-arch digest
    #   sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
    # 升级时改这一个值即可（也可用 HERMES_IMAGE 环境变量覆盖）。
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.2}
    container_name: ag-hermes
    restart: unless-stopped
    # ★ 必须显式指定 command。
    # 不传参时 CMD 走 `hermes`（交互式 CLI），启动后立即退出，
    # 容器会无限重启（实测 RestartCount 持续增长、端口随机漂移）。
    # `gateway run` 才是常驻进程；dashboard 由 s6 在同一容器内监管。
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${DATA_UID:-1000}
      HERMES_GID: ${DATA_GID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      # 隧道总开关：0=永不使用（direct 环境默认），1=有私钥时才建立
      TUNNEL_ENABLED: ${TUNNEL_ENABLED:-0}
      TUNNEL_HOST: ${TUNNEL_HOST:-ubuntu@43.156.187.79}
      TUNNEL_PORT: ${TUNNEL_PORT:-8899}

      # ── OpenAI 兼容 API server（公开聊天走这里）──
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # ★ 注意：hermes 会把 /opt/data/.env 以 override=True 加载，
      #   .env 中的同名变量会**覆盖**容器环境变量。
      #   首次启动时 hermes 会自己生成 API_SERVER_KEY 写入 /opt/data/.env。
      #   因此控制层**必须**从 /opt/data/.env 读取实际生效的 key，
      #   而不是用 compose 里的值（否则必然 401，实测踩过）。
      #   控制层通过 HERMES_API_KEY 显式注入，见下方 control 服务。
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY is required}

      # ── 多 profile 路由：/p/<profile>/v1/... ──
      GATEWAY_MULTIPLEX_PROFILES: "true"

      # ── dashboard（与 gateway 同容器，由 s6 监管）──
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      # 容器内绑 0.0.0.0，否则同网络的其他容器访问不到
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      # 非 loopback 绑定**必须**有 auth provider，否则启动即失败
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:?DASHBOARD_USER is required}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SECRET:?DASHBOARD_SECRET is required}
    volumes:
      # ★ 关键：绝对路径指向 ext4，不能用 /mnt/d。统一由 DATA_DIR 派生。
      - ${DATA_DIR:-./data}/hermes:/opt/data
      # 隧道脚本：仅在 cn 环境且存在私钥时生效（脚本内部双重判断）
      - ./scripts/99-tunnel:/etc/cont-init.d/99-tunnel:ro
    mem_limit: ${HERMES_MEM_LIMIT:-0}
    expose:
      - "8642"
      - "9119"
    healthcheck:
      # /health 需要 API_SERVER_ENABLED + Bearer
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Authorization: Bearer $$API_SERVER_KEY"
          http://127.0.0.1:8642/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      # s6 的 cont-init（chown / profile reconcile / dashboard toggle）需要时间
      start_period: 90s
    networks:
      - ag-net

  # ───────────────────────────────────────────────────────────
  # 控制层数据库
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agent_gateway}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-0}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_gateway} -d ${POSTGRES_DB:-agent_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ag-net

  # ───────────────────────────────────────────────────────────
  # 控制层后端（第 2 步起逐步填充）
  # ───────────────────────────────────────────────────────────
  control:
    build:
      context: ./control
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: agent-gateway-control:latest
    container_name: ag-control
    restart: unless-stopped
    # 与 hermes 用同一 uid:gid 运行，避免写共享 hermes-data 时 PermissionError
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    mem_limit: ${CONTROL_MEM_LIMIT:-0}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_gateway}:${POSTGRES_PASSWORD}@ag-postgres:5432/${POSTGRES_DB:-agent_gateway}
      HERMES_DASHBOARD_URL: http://ag-hermes:9119
      HERMES_DASHBOARD_USER: ${DASHBOARD_USER}
      HERMES_DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      HERMES_GATEWAY_URL: http://ag-hermes:8642
      # ★ 不要依赖这个值：hermes 会用 override=True 加载 /opt/data/.env，
      #   其中的 API_SERVER_KEY 会覆盖容器环境变量（实测踩过，见 SPEC §11.8.1）。
      #   控制层实际从挂载的 .env 文件读取生效值。
      HERMES_API_KEY: ${API_SERVER_KEY}
      HERMES_DOTENV_PATH: /opt/hermes-data/.env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-30}
      TZ: ${TZ:-Asia/Shanghai}
      # Gemini 隧道（模型连接测试从 control 容器发请求，需与 hermes 一样走隧道）
      TUNNEL_ENABLED: ${TUNNEL_ENABLED:-0}
      TUNNEL_HOST: ${TUNNEL_HOST:-ubuntu@43.156.187.79}
      TUNNEL_PORT: ${TUNNEL_PORT:-8899}
      TUNNEL_UPSTREAM_HOSTS: ${TUNNEL_UPSTREAM_HOSTS:-generativelanguage.googleapis.com}
      TUNNEL_LOCAL_BASE: ${TUNNEL_LOCAL_BASE:-http://127.0.0.1:8899}
    volumes:
      # hermes 数据目录：读写挂载。
      # - 读：解析实际生效的 API_SERVER_KEY（hermes 会用 .env 覆盖环境变量）
      # - 写：A2A 配置需要改 profile 的 config.yaml（原子写 + rename）
      - ${DATA_DIR:-./data}/hermes:/opt/hermes-data
      # 隧道私钥（与 hermes 共用同一份；不存在时为空目录，entrypoint 会跳过）
      - ${DATA_DIR:-./data}/hermes:/opt/data:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      hermes:
        condition: service_healthy
    profiles:
      - full          # 骨架阶段不启动，避免构建失败
    networks:
      - ag-net

  # ───────────────────────────────────────────────────────────
  # 前端（第 6 步填充）
  # ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: agent-gateway-web:dev
    container_name: ag-web
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-0}
    environment:
      # 服务端 rewrite 目标（/api/* → 控制层）
      CONTROL_URL: http://ag-control:8000
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "3000"
    depends_on:
      - control
    profiles:
      - full
    networks:
      - ag-net

  # ───────────────────────────────────────────────────────────
  # 反向代理：唯一对外端口
  # ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ag-nginx
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-0}
    ports:
      - "${GATEWAY_PORT:-10099}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx 的 upstream 是 ag-control:8000 与 ag-web:3000；必须等它们就绪，
    # 否则启动时 DNS 尚未注册 upstream 主机名，报 "host not found in upstream"。
    depends_on:
      control:
        condition: service_healthy
      web:
        condition: service_started
    profiles:
      - full
    networks:
      - ag-net

networks:
  ag-net:
    driver: bridge
